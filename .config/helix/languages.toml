[[language]]
name = "markdown"
indent = { tab-width = 4, unit = "    " }
text-width = 160

[[language]]
name = "html"
indent = { tab-width = 2, unit = "  " }
text-width = 160

[[language]]
name = "nu"
indent = { tab-width = 2, unit = "    " }
text-width = 160

[[language]]
name = "kdl"
indent = { tab-width = 4, unit = "    " }
text-width = 160

[[language]]
name = "rust"
text-width = 160
language-servers = ["rust-analyzer"]
soft-wrap.enable = false

[language-server.rust-analyzer.config]
inlayHints.parameterHints.enable = false
inlayHints.closingBraceHints.minLines = 10

[language.debugger]
command = "codelldb"
name = "codelldb"
port-arg = "--port {}"
transport = "tcp"

[[language.debugger.templates]]
name = "binary"
request = "launch"

[[language.debugger.templates.completion]]
completion = "filename"
name = "binary"

[language.debugger.templates.args]
program = "{0}"
runInTerminal = true

[[language]]
name = "toml"
text-width = 160

[[language]]
name = "c"
text-width = 160

[[language]]
name = "sql"
indent = { tab-width = 2, unit = "  " }
text-width = 160
